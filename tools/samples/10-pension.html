<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
:root{--kr:'WenQuanYi Zen Hei',sans-serif;--ink:#FFF7EE}
*{box-sizing:border-box;margin:0}
body{background:#16201B;color:var(--ink);font-family:var(--kr)}
.hero{position:relative;height:900px;overflow:hidden;background:linear-gradient(180deg,#F4B98A 0%,#E98E6B 30%,#9C6A7E 55%,#3E4A5E 75%)}
.sun{position:absolute;left:50%;top:430px;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:radial-gradient(circle,#FFE9C4,#FFC98E 70%)}
svg{position:absolute;left:0;bottom:0;width:100%;height:560px}
nav{position:relative;display:flex;justify-content:space-between;align-items:center;padding:32px 64px}
.logo{font:34px 'Italiana';letter-spacing:.2em}.logo small{display:block;font:12px var(--kr);letter-spacing:.5em;opacity:.85}
nav ul{display:flex;gap:44px;list-style:none;padding:0;font:15px 'WorkSans';letter-spacing:.16em}
nav .btn{background:var(--ink);color:#2B2A33;padding:13px 24px;border-radius:999px;font-size:14px}
.copy{position:relative;text-align:center;margin-top:40px}
.copy p.o{font:16px 'WorkSans';letter-spacing:.5em}
h1{font:400 112px/1 'Italiana';letter-spacing:.02em;margin:18px 0 20px;text-shadow:0 2px 30px rgba(120,50,40,.25)}
.copy p.k{font-size:22px;text-shadow:0 1px 12px rgba(120,50,40,.35)}
.book{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,1fr) auto;align-items:center;background:rgba(255,247,238,.95);color:#22302A;border-radius:22px;padding:14px 14px 14px 30px;gap:30px;width:900px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.book span{font-size:13px;color:#6C766F}.book b{display:block;font-weight:400;font-size:17px;color:#22302A;margin-top:2px}
.book a{background:#22302A;color:#fff;padding:18px 30px;border-radius:14px;font-size:15px}
.rooms{position:absolute;right:64px;top:180px;display:grid;gap:10px;font-size:14px;text-align:right;opacity:.92}
.rooms em{font:italic 15px 'Lora';font-style:italic}
</style></head><body>
